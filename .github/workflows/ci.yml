# PR・main push ごとの品質ゲート（RELEASE.md 2 章）。
# macOS 固有処理を含まない検証は消費係数 1 倍の Linux ランナーで行う。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - name: Enforce lockfile
        run: dart pub get --enforce-lockfile
        working-directory: packages/core
      - name: Analyze
        run: dart analyze
        working-directory: packages/core
      - name: Test
        run: dart test
        working-directory: packages/core

  mcp_server:
    name: mcp_server (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - name: Enforce lockfile
        run: dart pub get --enforce-lockfile
        working-directory: apps/mcp_server
      - name: Analyze
        run: dart analyze
        working-directory: apps/mcp_server
      - name: Test
        run: dart test
        working-directory: apps/mcp_server

  desktop:
    name: desktop (analyze + widget test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - name: Enforce lockfile
        run: flutter pub get --enforce-lockfile
        working-directory: apps/desktop
      - name: Analyze
        run: flutter analyze
        working-directory: apps/desktop
      - name: Test
        run: flutter test
        working-directory: apps/desktop

  # Phase B (#71): macOS native core conformance gate.
  # Runs the shared spec/testdata fixtures through the Swift implementation.
  # A macOS runner is required (Darwin SDK).
  macos-core:
    name: macos-core (swift build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The runner default Xcode is used on purpose. Pinning an older Swift
      # (e.g. 6.0) makes the SDK interop modules fail to build.
      # platforms: ["macOS": "14"] in Package.swift pins the deployment target.
      - name: Resolve (no external deps expected)
        run: swift package dump-package
        working-directory: apps/macos
      - name: Build
        run: swift build
        working-directory: apps/macos
      - name: Test (spec conformance)
        run: swift test
        working-directory: apps/macos
      # B′ (#78): popover の実描画スモーク。アプリ自身のウィンドウを
      # CGWindowListCreateImage でキャプチャするため画面収録権限が不要。
      # スモークは put した後 NSApp.terminate で自動終了する。
      - name: UI smoke (popover render)
        run: |
          set -euo pipefail
          MOOST_UI_SMOKE=1 .build/debug/MoostApp > /tmp/moost-smoke.log 2>&1 &
          APP_PID=$!
          # 自動終了を待つ（最大 120 秒）
          for _ in $(seq 1 60); do
            if ! kill -0 $APP_PID 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 $APP_PID 2>/dev/null; then
            kill -9 $APP_PID
            echo "UI smoke did not exit in time" >&2
            exit 1
          fi
          cat /tmp/moost-smoke.log
          test -s /tmp/moost-popover-1.png
          test -s /tmp/moost-popover-2.png
          test -s /tmp/moost-popover-3.png
          grep -q "SMOKE sessions=" /tmp/moost-smoke.log
          # 3 回分のキャプチャが成功していること（CGWindowList が拒否される
          # 環境では NSView 直接レンダリングのフォールバックで保存される）
          test "$(grep -c 'SMOKE: captured' /tmp/moost-smoke.log)" -ge 3
          # 暗転の回帰チェック: キー状態をログに残す（実画面キャプチャが
          # 可能な環境では key=true が 2 回以上になること）
          grep -q 'key=' /tmp/moost-smoke.log
        working-directory: apps/macos

  osv-scan:
    name: osv-scanner (lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # メジャーバージョンだけのタグ（@v2）は提供されていないため完全一致で指定する
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=./packages/core/pubspec.lock
            --lockfile=./apps/desktop/pubspec.lock
            --lockfile=./apps/mcp_server/pubspec.lock
