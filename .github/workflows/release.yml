# タグ push で起動するリリース自動化（RELEASE.md 3.2）。
# analyze / test を再実行してから macOS の dmg と Linux (Ubuntu) の .deb を
# ビルドし、両方を GitHub Release へ添付する。
#
# 使い方:
#   1. CHANGELOG の [Unreleased] を [x.y.z] - YYYY-MM-DD に確定
#   2. apps/desktop/pubspec.yaml の version を上げてコミット（PR → マージ）
#   3. git tag v<x.y.z> && git push origin v<x.y.z>
#
# `-` を含むタグ（例: v0.0.1-citest）は prerelease として作成される。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # === macOS: dmg ビルド（既存フロー） ===
  build-macos:
    name: Build macOS (dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Enforce lockfiles
        run: |
          (cd packages/core && dart pub get --enforce-lockfile)
          (cd apps/desktop && flutter pub get --enforce-lockfile)
          (cd apps/mcp_server && dart pub get --enforce-lockfile)

      - name: Analyze and test
        run: |
          (cd packages/core && dart analyze && dart test)
          (cd apps/desktop && flutter analyze && flutter test)
          (cd apps/mcp_server && dart analyze && dart test)

      - name: Build macOS app (release)
        run: flutter build macos --release
        working-directory: apps/desktop

      # MCP サーバーを単体バイナリにし、.app へ同梱する（Issue #45）
      - name: Build and embed moost-mcp binary
        run: |
          dart compile exe bin/moost_mcp.dart -o moost-mcp
          mkdir -p "../desktop/build/macos/Build/Products/Release/moost_desktop.app/Contents/Resources"
          cp moost-mcp \
            "../desktop/build/macos/Build/Products/Release/moost_desktop.app/Contents/Resources/moost-mcp"
        working-directory: apps/mcp_server

      - name: Ad-hoc sign
        run: >
          codesign --force --deep --sign -
          "apps/desktop/build/macos/Build/Products/Release/moost_desktop.app"

      - name: Create dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/dmg
          cp -R "apps/desktop/build/macos/Build/Products/Release/moost_desktop.app" \
            "dist/dmg/Moost.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Moost $VERSION" -srcfolder dist/dmg \
            -ov -format UDZO "dist/Moost-$VERSION.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "artifact dir already populated"

      - uses: actions/upload-artifact@v4
        with:
          name: moost-macos
          path: dist/Moost-*.dmg
          if-no-files-found: error

  # === Linux (Ubuntu): .deb ビルド ===
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Enforce lockfiles
        run: |
          (cd packages/core && dart pub get --enforce-lockfile)
          (cd apps/desktop && flutter pub get --enforce-lockfile)
          (cd apps/mcp_server && dart pub get --enforce-lockfile)

      - name: Analyze and test
        run: |
          (cd packages/core && dart analyze && dart test)
          (cd apps/desktop && flutter analyze && flutter test)
          (cd apps/mcp_server && dart analyze && dart test)

      # Linux ビルドに必要なシステムライブラリ（本番 .deb の Depends と一致）
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev dpkg-dev

      - name: Build Linux app (release)
        run: flutter build linux --release
        working-directory: apps/desktop

      # MCP サーバーを単体バイナリにし、Linux バンドルの実行ファイル直下へ
      # 同梱する（McpBinaryLocator の Linux 分岐に対応）
      - name: Build and embed moost-mcp binary into the Linux bundle
        run: |
          dart compile exe bin/moost_mcp.dart -o moost-mcp
          cp moost-mcp ../desktop/build/linux/x64/release/bundle/moost-mcp
          chmod +x ../desktop/build/linux/x64/release/bundle/moost-mcp
        working-directory: apps/mcp_server

      - name: Package .deb
        run: ./scripts/linux/package_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moost-linux
          path: dist/moost_*.deb
          if-no-files-found: error

  # === リリース作成（両成果物を添付） ===
  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: moost-macos
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: moost-linux
          path: dist/linux

      - name: Collect artifacts and compute hashes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist/macos dist/linux
          DMG=$(ls dist/macos/Moost-*.dmg)
          DEB=$(ls dist/linux/moost_*.deb)
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          echo "DEB_PATH=$DEB" >> "$GITHUB_ENV"
          DMG_SHA=$(sha256sum "$DMG" | awk '{print $1}')
          echo "DMG_SHA=$DMG_SHA" >> "$GITHUB_ENV"

      # CHANGELOG から該当節を抜き出す（既存フローと同じ）
      - name: Extract changelog section
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \\[/ {flag=0}
            flag' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "(CHANGELOG に $VERSION の節がありません)" > RELEASE_NOTES.md
          fi

      # プラットフォーム別のインストールコマンドをノート末尾に付ける
      - name: Append install commands
        run: |
          cat >> RELEASE_NOTES.md << EOF

          ## インストール

          ### macOS

          Homebrew を使っている場合:

          \`\`\`bash
          brew upgrade --cask moost
          \`\`\`

          使っていない場合:

          \`\`\`bash
          gh release download $GITHUB_REF_NAME -R ${{ github.repository }} -p '*.dmg' -O ~/Downloads/Moost.dmg
          open ~/Downloads/Moost.dmg
          \`\`\`

          ### Linux (Ubuntu / Debian)

          \`\`\`bash
          gh release download $GITHUB_REF_NAME -R ${{ github.repository }} -p '*.deb' -O ~/Downloads/Moost.deb
          sudo apt install ~/Downloads/Moost.deb
          \`\`\`

          GNOME でトレイアイコンが出ない場合は、拡張機能「AppIndicator and
          KStatusNotifierItem Support」を有効にしてください（Ubuntu は既定で有効）。
          \`gnome-extensions enable ubuntu-appindicators@ubuntu.com\` で確認できます。
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" "$DEB_PATH" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE_FLAG

      # Homebrew tap の cask を新バージョンへ書き換える（Issue #11）。
      # GITHUB_TOKEN は自リポジトリにしか効かないため、tap への push は
      # 書き込み可 deploy key（secret: TAP_DEPLOY_KEY）で行う。
      # prerelease（タグに '-' 入り）は brew に流さない
      - name: Bump Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:rami2076/homebrew-tap.git tap
          cd tap

          # sed での部分置換はフォーマット変化に弱いため、cask は毎回丸ごと生成する
          cat > Casks/moost.rb << EOF
          cask "moost" do
            version "$VERSION"
            sha256 "$DMG_SHA"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/Moost-#{version}.dmg"
            name "Moost"
            desc "Attach memos to AI coding agent sessions and resume them from the system tray"
            homepage "https://github.com/${{ github.repository }}"

            app "Moost.app"
            # Moost.app に同梱した MCP サーバーを CLI からも直接叩けるように
            # symlink する（Issue #45）。設定画面から連携登録する際は、
            # インストール先アプリの中の実体パスを直接指定するため
            # この symlink 自体は経由しない
            binary "#{appdir}/Moost.app/Contents/Resources/moost-mcp"

            caveats <<~EOS
              Moost is currently ad-hoc signed. If Gatekeeper blocks the first launch,
              remove the quarantine attribute:

                xattr -dr com.apple.quarantine /Applications/Moost.app
            EOS
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/moost.rb
          git commit -m "moost $VERSION"
          git push origin main
