# タグ push で起動するリリース自動化（RELEASE.md 3.2 / プラットフォーム規約）。
# Swift 版（apps/macos）のみをビルドする。Flutter 版は ADR-005 で廃止済み、
# Linux / Windows はフェーズ D（#73）でプラットフォームジョブを追加する。
#
# タグ規約: v<semver>-<platform>（例: v2.0.0-macos）。
#   - `-macos` / `-linux` / `-windows` は正式リリース（prerelease にしない）
#   - `-rc*` 等の prerelease タグは GitHub 上 prerelease として扱う
#
# 使い方:
#   1. CHANGELOG の [Unreleased] を [x.y.z] - YYYY-MM-DD に確定
#   2. apps/macos/Sources/MoostApp/AppInfo.swift の version を上げてコミット
#      （PR → マージ）
#   3. git tag v<x.y.z>-<platform> && git push origin v<x.y.z>-<platform>
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # === macOS: Swift 版ビルド + .app バンドル + dmg ===
  build-macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version parts from tag
        run: |
          # タグ: v2.0.0-macos  → VERSION=2.0.0-macos / SEMVER=2.0.0 / PLATFORM=macos
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SEMVER="${VERSION%-*}"
          PLATFORM="${VERSION##*-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SEMVER=$SEMVER" >> "$GITHUB_ENV"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "tag=$TAG version=$VERSION semver=$SEMVER platform=$PLATFORM"

      - name: Swift build (release)
        run: swift build -c release
        working-directory: apps/macos

      - name: Assemble app bundle
        shell: bash
        run: |
          APP="dist/Moost.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp apps/macos/.build/release/MoostApp "$APP/Contents/MacOS/MoostApp"
          cp apps/macos/Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed -e "s/@SEMVER@/$SEMVER/g" -e "s/@VERSION@/$VERSION/g" \
            apps/macos/Resources/Info.plist > "$APP/Contents/Info.plist"
          ls -la "$APP/Contents/MacOS"

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/Moost.app"

      - name: Create dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/Moost.app dist/dmg/Moost.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Moost $VERSION" -srcfolder dist/dmg \
            -ov -format UDZO "dist/Moost-$VERSION.dmg"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: moost-macos
          path: dist/Moost-*.dmg
          if-no-files-found: error

  # === リリース作成（dmg を添付）+ Homebrew tap bump ===
  release:
    name: Create GitHub Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: moost-macos
          path: dist/macos

      - name: Collect artifacts and compute hashes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist/macos
          DMG=$(ls dist/macos/Moost-*.dmg)
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          DMG_SHA=$(sha256sum "$DMG" | awk '{print $1}')
          echo "DMG_SHA=$DMG_SHA" >> "$GITHUB_ENV"

      # CHANGELOG から該当節を抜き出す。タグ名が v2.0.0-macos のような場合も
      # CHANGELOG の見出し（## [2.0.0]）と一致するよう、最初の「-」で切る。
      - name: Extract changelog section
        run: |
          V="$(echo "$VERSION" | cut -d- -f1)"
          echo "VERSION=$VERSION (changelog 検索用: $V)"
          awk -v ver="$V" '
            index($0, "## [" ver "]") == 1 {flag=1; next}
            index($0, "## [") == 1 {flag=0}
            flag' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "(CHANGELOG に $V の節がありません)" > RELEASE_NOTES.md
          fi

      - name: Append install commands
        run: |
          cat >> RELEASE_NOTES.md << EOF

          ## インストール（macOS）

          Homebrew を使っている場合:

          \`\`\`bash
          brew upgrade --cask moost
          \`\`\`

          使っていない場合:

          \`\`\`bash
          gh release download $GITHUB_REF_NAME -R ${{ github.repository }} -p '*.dmg' -O ~/Downloads/Moost.dmg
          open ~/Downloads/Moost.dmg
          \`\`\`

          インストール後に MCP サーバーを登録する場合:

          \`\`\`bash
          moost mcp
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # プラットフォーム記号（-macos 等）は正式リリース。prerelease は -rc 系のみ
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE_FLAG

      # Homebrew tap の cask を新バージョンへ書き換える。cask の version は
      # タグ規約に合わせ「2.0.0-macos」とし、URL がアセット名と完全一致する。
      # 以前の Flutter 版 cask にあった moost-mcp symlink は廃止（MCP サーバーは
      # MoostApp バイナリに内蔵。代わりに `moost` コマンドを切る）。
      - name: Bump Homebrew tap
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:rami2076/homebrew-tap.git tap
          cd tap

          cat > Casks/moost.rb << EOF
          cask "moost" do
            version "$VERSION"
            sha256 "$DMG_SHA"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/Moost-#{version}.dmg"
            name "Moost"
            desc "Attach memos to AI coding agent sessions and resume them from the system tray"
            homepage "https://github.com/${{ github.repository }}"

            app "Moost.app"
            # MoostApp は MCP サーバー内蔵の単一バイナリ。
            # moost mcp / moost --version を CLI から使えるようにする
            binary "#{appdir}/Moost.app/Contents/MacOS/MoostApp", target: "moost"

            caveats <<~EOS
              Moost is currently ad-hoc signed. If Gatekeeper blocks the first launch,
              remove the quarantine attribute:

                xattr -dr com.apple.quarantine /Applications/Moost.app
            EOS
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/moost.rb
          git commit -m "moost $VERSION"
          git push origin main
